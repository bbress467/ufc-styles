# Deploy the interactive style map (site/) to GitHub Pages whenever main changes.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy style map site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check the site's data file is present
        run: test -s site/data/fighters.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
